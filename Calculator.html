<!doctype html>
<html lang="en">
  <head>
    <title>Calculator</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    #display {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
  </style>
  <body>
    <div class="container">
      <h1>Calculator</h1>
      <input type="number" id="ip1" placeholder="Enter first number" />
      <input type="number" id="ip2" placeholder="Enter second number" />
      <div class="buttons">
        <button type="button" onclick="calculateAdd()">Add</button>
        <button type="button" onclick="calculateSub()">Sub</button>
        <button type="button" onclick="calculateMul()">Mul</button>
        <button type="button" onclick="calculateDiv()">Div</button>
        <button type="button" onclick="calculateMod()">Mod</button>
        <button type="button" onclick="clearInput()">Clear</button>
      </div>
      <p id="display"></p>
    </div>
    <script>
      function add(num1, num2) {
        let result = num1 + num2;
        return result;
      }

      function sub(num1, num2) {
        return num1 - num2;
      }

      function mul(num1, num2) {
        let result = num1 * num2;
        return result;
      }

      function div(num1, num2) {
        if (num2 === 0) {
          return "Cannot divide by zero";
        }
        return num1 / num2;
      }

      function mod(num1, num2) {
        if (num2 === 0) {
          return "Cannot divide by zero";
        }

        return num1 % num2;
      }

      function getNumbers() {
        let num1 = Number(document.getElementById("ip1").value);
        let num2 = Number(document.getElementById("ip2").value);
        return [num1, num2];
      }

      function clearInput() {
        document.getElementById("ip1").value = "";
        document.getElementById("ip2").value = "";
        document.getElementById("display").textContent = "";
      }

      function calculateAdd() {
        let [num1, num2] = getNumbers();

        let result = add(num1, num2);

        document.getElementById("display").textContent = result;
      }

      function calculateSub() {
        let [num1, num2] = getNumbers();

        let result = sub(num1, num2);

        document.getElementById("display").textContent = result;
      }

      function calculateMul() {
        let [num1, num2] = getNumbers();

        let result = mul(num1, num2);

        document.getElementById("display").textContent = result;
      }

      function calculateDiv() {
        let [num1, num2] = getNumbers();

        let result = div(num1, num2);

        document.getElementById("display").textContent = result;
      }

      function calculateMod() {
        let [num1, num2] = getNumbers();
        let result = mod(num1, num2);

        document.getElementById("display").textContent = result;
      }
    </script>
  </body>
</html>
